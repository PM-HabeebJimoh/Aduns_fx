[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aduns-fx"
version = "0.1.0"
description = "HYDRA-PRIME multi-temporal pre-movement decision engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aduns FX" }]
dependencies = []

[project.scripts]
hydra-prime = "aduns_fx.cli:main"

[tool.setuptools]
packages = ["aduns_fx"]
